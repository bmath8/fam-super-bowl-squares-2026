              </div>
            </div>

            {/* Grouped Settings */}
            <details style={{ marginBottom: 16, background: "var(--card)", borderRadius: 10, border: "1px solid var(--border)" }}>
              <summary style={{ padding: "12px", fontWeight: 600, fontSize: 13, cursor: "pointer", color: "var(--text)" }}>Pool & Prices</summary>
              <div style={{ padding: "12px", borderTop: "1px solid var(--border)" }}>
                {/* Pool Settings Content */}
                <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 8 }}>
                  <label style={{ fontSize: 12, color: "var(--text)", flex: 1 }}>Price per square</label>
                  <input type="number" value={data.pool?.pricePerSquare || 0}
                    onChange={e => dbr.child("pool/pricePerSquare").set(Number(e.target.value))}
                    style={{ width: 60, padding: "6px", borderRadius: 6, border: "1px solid var(--border2)", background: "var(--input)", color: "var(--text)", fontSize: 14, textAlign: "center" }} />
                </div>
                <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 8 }}>
                  <label style={{ fontSize: 12, color: "var(--text)", flex: 1 }}>Max per player</label>
                  <input type="number" value={data.settings?.maxPerPlayer || 0}
                    onChange={e => dbr.child("settings/maxPerPlayer").set(Number(e.target.value))}
                    style={{ width: 60, padding: "6px", borderRadius: 6, border: "1px solid var(--border2)", background: "var(--input)", color: "var(--text)", fontSize: 14, textAlign: "center" }} />
                </div>
              </div>
            </details>

            <details style={{ marginBottom: 16, background: "var(--card)", borderRadius: 10, border: "1px solid var(--border)" }}>
              <summary style={{ padding: "12px", fontWeight: 600, fontSize: 13, cursor: "pointer", color: "var(--text)" }}>Payout Split</summary>
              <div style={{ padding: "12px", borderTop: "1px solid var(--border)" }}>
                <div style={{ display: "flex", gap: 4, marginBottom: 8 }}>
                  {Object.entries(PAYOUTS).map(([k, v]) => (
                    <button key={k} onClick={() => dbr.child("pool").update({ payoutPreset: k, payoutSplit: v.vals })} style={{
                      flex: 1, padding: "8px 4px", borderRadius: 8, fontSize: 10, fontWeight: 600,
                      border: `1px solid ${data.pool?.payoutPreset === k ? "var(--gold)" : "var(--border2)"}`,
                      background: data.pool?.payoutPreset === k ? "var(--gold-glow)" : "transparent",
                      color: data.pool?.payoutPreset === k ? "var(--gold)" : "var(--soft)",
                    }}>{v.label}</button>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  {QS.map((q, i) => (
                    <input key={q} type="number" value={(data.pool?.payoutSplit || [])[i] || 0}
                      onChange={e => { const s = [...(data.pool?.payoutSplit || [25, 25, 25, 25])]; s[i] = Number(e.target.value); dbr.child("pool/payoutSplit").set(s) }}
                      style={{ flex: 1, padding: "6px", borderRadius: 6, border: "1px solid var(--border2)", background: "var(--input)", color: "var(--text)", fontSize: 13, textAlign: "center" }} />
                  ))}
                </div>
              </div>
            </details>

            <details style={{ marginBottom: 16, background: "var(--card)", borderRadius: 10, border: "1px solid var(--border)" }}>
              <summary style={{ padding: "12px", fontWeight: 600, fontSize: 13, cursor: "pointer", color: "var(--text)" }}>Admin / Hazard</summary>
              <div style={{ padding: "12px", borderTop: "1px solid var(--border)" }}>
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1, color: "var(--soft)", display: "block", marginBottom: 4 }}>HOST PIN</label>
                  <input value={data.hostPin || ""} onChange={e => dbr.update({ hostPin: e.target.value })} placeholder="Set PIN"
                    style={{ width: "100%", padding: "8px", borderRadius: 8, border: "1px solid var(--border2)", background: "var(--input)", color: "var(--text)", fontSize: 14 }} />
                </div>
                <button onClick={resetBoard} style={{ width: "100%", padding: "10px", borderRadius: 8, border: "1px solid rgba(239,68,68,0.3)", background: "rgba(239,68,68,0.05)", color: "#EF4444", fontWeight: 700, fontSize: 12 }}>
                  🗑 Reset Board
                </button>
              </div>
            </details>

            <button onClick={onClose} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "1px solid var(--border2)", background: "var(--card)", color: "var(--text)", fontWeight: 700, fontSize: 14, marginBottom: 12 }}>
              Close
            </button>
          </div>
        </div>
      );
    }

    // ── Share Modal ───────────────────────────────────────────────
    function ShareModal({ data, room, onClose, toast }) {
      const url = `${window.location.origin}${window.location.pathname}?room=${room}`;

      const shareText = `🏈 Super Bowl LX Squares!\n\nSEAHAWKS vs PATRIOTS\n$${data.pool?.pricePerSquare || 5}/square\n\nJoin here: ${url}\nRoom: ${room}`;

      const share = async () => {
        if (navigator.share) {
          try { await navigator.share({ title: "Super Bowl LX Squares", text: shareText, url }); }
          catch (e) { }
        } else {
          navigator.clipboard.writeText(shareText);
          toast("Link copied!");
        }
        onClose();
      };

      const copy = () => {
        navigator.clipboard.writeText(url);
        toast("Link copied!");
      };

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 999, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }} onClick={e => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "var(--card)", borderRadius: 16, padding: 24, maxWidth: 380, width: "100%", border: "1px solid var(--border2)", animation: "slideUp .3s ease" }}>
            <div className="bebas" style={{ fontSize: 20, letterSpacing: 2, color: "var(--gold)", marginBottom: 16 }}>📱 SHARE GAME</div>

            <div style={{ background: "var(--input)", borderRadius: 10, padding: "12px", marginBottom: 16, wordBreak: "break-all" }}>
              <div style={{ fontSize: 11, color: "var(--soft)", marginBottom: 4 }}>Game Link</div>
              <div style={{ fontSize: 13, color: "var(--gold)", fontWeight: 600 }}>{url}</div>
            </div>

            <div style={{ background: "var(--input)", borderRadius: 10, padding: "12px", marginBottom: 16 }}>
              <div style={{ fontSize: 11, color: "var(--soft)", marginBottom: 4 }}>Room Code</div>
              <div className="bebas" style={{ fontSize: 28, color: "var(--text)", letterSpacing: 4 }}>{room}</div>
            </div>

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={share} style={{ flex: 1, padding: "12px", borderRadius: 10, border: "none", background: "var(--gold)", color: "#1a1a1a", fontWeight: 700, fontSize: 13 }}>
                📤 Share
              </button>
              <button onClick={copy} style={{ flex: 1, padding: "12px", borderRadius: 10, border: "1px solid var(--border2)", background: "transparent", color: "var(--text)", fontWeight: 700, fontSize: 13 }}>
                📋 Copy Link
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Rules Modal ───────────────────────────────────────────────
    function RulesModal({ data, onClose }) {
      const pps = data.pool?.pricePerSquare || 5;
      const split = data.pool?.payoutSplit || [25, 25, 25, 25];
      const claimed = data.grid?.flat().filter(Boolean).length || 0;
      const pot = claimed * pps;

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 999, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={e => e.target === e.currentTarget && onClose()}>
          <div style={{
            background: "var(--bg)", borderRadius: "20px 20px 0 0", padding: "24px", maxWidth: 480, width: "100%",
            maxHeight: "80vh", overflowY: "auto", border: "1px solid var(--border2)", borderBottom: "none", animation: "slideUp .3s ease"
          }}>
            <div style={{ width: 40, height: 4, borderRadius: 2, background: "var(--border2)", margin: "0 auto 16px" }} />
            <div className="bebas" style={{ fontSize: 22, letterSpacing: 2, color: "var(--gold)", marginBottom: 16 }}>📋 HOW TO PLAY</div>

            <div style={{ fontSize: 13, color: "var(--text)", lineHeight: 1.7 }}>
              <p style={{ marginBottom: 12 }}>
                <strong style={{ color: "var(--gold)" }}>1. Claim Squares</strong> — Tap any empty cell on the grid to claim it.
                Use Quick Pick (🎲) to grab multiple random squares at once.
              </p>
              <p style={{ marginBottom: 12 }}>
                <strong style={{ color: "var(--gold)" }}>2. Numbers Get Assigned</strong> — Once all squares are claimed,
                the host locks the board. Random numbers 0-9 are assigned to each row (Patriots) and column (Seahawks).
              </p>
              <p style={{ marginBottom: 12 }}>
                <strong style={{ color: "var(--gold)" }}>3. Check Winners</strong> — After each quarter, look at the last digit
                of each team's score. The square where those digits intersect wins!
              </p>
              <p style={{ marginBottom: 12 }}>
                <strong style={{ color: "var(--gold)" }}>4. Payouts</strong> — Each square costs <strong>${pps}</strong>.
                The pot is split across quarters: {split.map((s, i) => `${QS[i]}: ${s}%`).join(", ")}.
              </p>
              <p style={{ color: "var(--soft)" }}>
                Example: If the score is SEA 17, NE 13 — the winning square is at column 7, row 3.
              </p>
            </div>

            <button onClick={onClose} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "1px solid var(--border2)", background: "var(--card)", color: "var(--text)", fontWeight: 700, fontSize: 14, marginTop: 20 }}>
              Got it!
            </button>
          </div>
        </div>
      );
    }

    // ── Winner Modal ──────────────────────────────────────────────
    function WinnerModal({ data, onClose }) {
      const allWinners = [];
      const claimed = data.grid?.flat().filter(Boolean).length || 0;
      const split = data.pool?.payoutSplit || [25, 25, 25, 25];
      const totalPot = claimed * (data.pool?.pricePerSquare || 0);

      QS.forEach((q, i) => {
        const seaQ = (data.scores?.SEA || [])[i], neQ = (data.scores?.NE || [])[i];
        if (seaQ != null && neQ != null) {
          const cumS = data.scores.SEA.slice(0, i + 1).reduce((a, b) => a + (b || 0), 0);
          const cumN = data.scores.NE.slice(0, i + 1).reduce((a, b) => a + (b || 0), 0);
          if (data.colNums && data.rowNums) {
            const winner = getWinner(data.grid, data.colNums, data.rowNums, cumS, cumN);
            if (winner) allWinners.push({ q, winner, amt: Math.round(totalPot * split[i] / 100) });
          }
        }
      });

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 2000, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }} onClick={onClose}>
          <div style={{ background: "var(--card)", borderRadius: 16, padding: 24, maxWidth: 360, width: "100%", border: "1px solid var(--gold)", animation: "slideUp .3s ease", textAlign: "center", position: "relative" }}>
            <div style={{ position: "absolute", top: -20, left: "50%", transform: "translateX(-50%)", fontSize: 40 }}>🏆</div>
            <div className="bebas" style={{ fontSize: 24, color: "var(--gold)", margin: "16px 0 16px" }}>WINNERS CIRCLE</div>

            {allWinners.length === 0 ? (
              <div style={{ color: "var(--soft)" }}>No winners yet!</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {allWinners.map(w => (
                  <div key={w.q} style={{ background: "var(--gold-glow)", padding: "12px", borderRadius: 10, border: "1px solid var(--gold)33" }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "var(--soft)", marginBottom: 4 }}>{w.q}</div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: "var(--text)" }}>
                      {getPlayerEmoji(data.playerMeta, w.winner)} {w.winner}
                    </div>
                    <div className="bebas" style={{ fontSize: 20, color: "var(--gold)", marginTop: 4 }}>${w.amt}</div>
                  </div>
                ))}
              </div>
            )}

            <button onClick={onClose} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", background: "var(--gold)", color: "#1a1a1a", fontWeight: 700, fontSize: 14, marginTop: 20 }}>
              Awesome!
            </button>
          </div>
        </div>
      );
    }

    // ── What Do I Need Modal ──────────────────────────────────────
    function NeedToWinModal({ data, myName, onClose }) {
      if (!data.colNums || !data.rowNums) return null;

      const mySquares = [];
      data.grid.forEach((row, r) => row.forEach((cell, c) => {
        if (cell === myName) mySquares.push({ r: data.rowNums[r], c: data.colNums[c], id: `R${r}C${c}` });
      }));

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 2000, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }} onClick={onClose}>
          <div style={{ background: "var(--card)", borderRadius: 16, padding: 24, maxWidth: 360, width: "100%", border: "1px solid var(--border)", animation: "slideUp .3s ease", maxHeight: "80vh", overflowY: "auto" }}>
            <div className="bebas" style={{ fontSize: 24, color: "var(--text)", marginBottom: 16, textAlign: "center" }}>MY WINNING NUMBERS</div>
            <div style={{ fontSize: 13, color: "var(--soft)", textAlign: "center", marginBottom: 16 }}>
              To win, the last digit of the score must match your numbers (Patriots row, Seahawks col).
            </div>

            {mySquares.length === 0 ? (
              <div style={{ color: "var(--soft)", textAlign: "center" }}>You have no covered squares!</div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(80px,1fr))", gap: 8 }}>
                {mySquares.map((sq, i) => (
                  <div key={i} style={{ background: "var(--input)", padding: "10px", borderRadius: 8, textAlign: "center", border: "1px solid var(--border2)" }}>
                    <div style={{ fontSize: 10, color: "var(--soft)", marginBottom: 4 }}>SQUARE {i + 1}</div>
                    <div style={{ display: "flex", justifyContent: "center", gap: 8, fontWeight: 700, fontSize: 14 }}>
                      <span style={{ color: NER }}>NE {sq.r}</span>
                      <span style={{ color: SEA }}>SEA {sq.c}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <button onClick={onClose} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "1px solid var(--border2)", background: "var(--card)", color: "var(--text)", fontWeight: 700, fontSize: 14, marginTop: 20 }}>
              Close
            </button>
          </div>
        </div>
      );
    }

    // ── Onboarding Modal ──────────────────────────────────────────
    function OnboardingModal({ onClose }) {
      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 3000, background: "rgba(0,0,0,0.9)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "var(--card)", borderRadius: 16, padding: 24, maxWidth: 360, width: "100%", border: "1px solid var(--gold)", animation: "slideUp .3s ease" }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <div style={{ fontSize: 40, marginBottom: 10 }}>🏈</div>
              <div className="bebas" style={{ fontSize: 24, color: "var(--gold)" }}>HOW TO PLAY</div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 16, marginBottom: 24 }}>
              <div style={{ display: "flex", gap: 12 }}>
                <div style={{ background: "var(--gold)", color: "#000", width: 24, height: 24, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, flexShrink: 0 }}>1</div>
                <div style={{ fontSize: 13, color: "var(--text)" }}><strong>Pick your squares.</strong> Tap any empty square to claim it.</div>
              </div>
              <div style={{ display: "flex", gap: 12 }}>
                <div style={{ background: "var(--gold)", color: "#000", width: 24, height: 24, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, flexShrink: 0 }}>2</div>
                <div style={{ fontSize: 13, color: "var(--text)" }}><strong>Watch the game.</strong> Rows & Cols get random numbers at kickoff.</div>
              </div>
              <div style={{ display: "flex", gap: 12 }}>
                <div style={{ background: "var(--gold)", color: "#000", width: 24, height: 24, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, flexShrink: 0 }}>3</div>
                <div style={{ fontSize: 13, color: "var(--text)" }}><strong>Win prizes!</strong> Match the last digit of the score at end of Q1, Q2, Q3, Final.</div>
              </div>
            </div>
            <button onClick={onClose} style={{
              width: "100%", padding: "12px", borderRadius: 10, border: "none",
              background: "var(--gold)", color: "#1a1a1a", fontSize: 14, fontWeight: 700
            }}>
              LET'S GO!
            </button>
          </div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────
    function App() {
      const [myName, setMyName] = useState(() => localStorage.getItem("sbName") || "");
      const [room, setRoom] = useState(() => new URLSearchParams(window.location.search).get("room") || "");
      const [joined, setJoined] = useState(false);
      const [showOnboarding, setShowOnboarding] = useState(() => !localStorage.getItem("onboarded"));
      const [data, setData] = useState(DEFAULT);
      const [isDark, setIsDark] = useState(() => localStorage.getItem("theme") !== "light");
      const [tab, setTab] = useState("board");
      const [toastMsg, setToastMsg] = useState(null);
      const [showSettings, setShowSettings] = useState(false);
      const [showShare, setShowShare] = useState(false);
      const [showRules, setShowRules] = useState(false);
      const [showWin, setShowWin] = useState(false);
      const [showNeed, setShowNeed] = useState(false);
      const [avatar, setAvatar] = useState(null);
      const [showAvatarPicker, setShowAvatarPicker] = useState(false);
      const dbrRef = useRef(null);

      const toast = useCallback((msg) => { setToastMsg(msg); }, []);

      const join = useCallback((name, rm) => {
        // Name collision check
        /*
        dbRef(rm).child("playerMeta").child(name).once("value", snap => {
          if (snap.exists() && !localStorage.getItem("sbName")) {
             // In a real app we'd block or ask password. 
             // Here we just allow rejoin but warn logic is implicit.
          }
        });
        */
        setMyName(name);
        setRoom(rm);
        localStorage.setItem("sbName", name);
        const ref = dbRef(rm);
        dbrRef.current = ref;

        // Set URL
        const url = new URL(window.location);
        url.searchParams.set("room", rm);
        window.history.replaceState({}, "", url);

        ref.on("value", snap => {
          const val = snap.val();
          if (val) setData({ ...DEFAULT, ...val });
          else ref.set(DEFAULT);
        });

        // Set player meta
        ref.child("playerMeta").child(name).once("value", snap => {
          const meta = snap.val();
          if (!meta) {
            const a = AVATARS[Math.floor(Math.random() * AVATARS.length)];
            ref.child("playerMeta").child(name).set({ avatar: a, joinedAt: Date.now() });
            setAvatar(a);
          } else {
            setAvatar(meta.avatar);
          }
        });



        setJoined(true);
      }, []);

      const dbr = dbrRef.current;

      const setMyAvatar = (a) => {
        setAvatar(a);
        dbr?.child("playerMeta").child(myName).child("avatar").set(a);
        setShowAvatarPicker(false);
      };

      // Theme toggle
      useEffect(() => {
        if (isDark) document.body.classList.remove("light-theme");
        else document.body.classList.add("light-theme");
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }, [isDark]);

      // Winner Check Trigger
      useEffect(() => {
        if (!data.colNums || !data.rowNums || !data.scores?.SEA || !data.scores?.NE) return;
        let found = false;
        for (let i = 0; i < 4; i++) {
          const s = data.scores.SEA[i], n = data.scores.NE[i];
          if (s != null && n != null) {
            const cs = data.scores.SEA.slice(0, i + 1).reduce((a, b) => a + (b || 0), 0);
            const cn = data.scores.NE.slice(0, i + 1).reduce((a, b) => a + (b || 0), 0);
            if (getWinner(data.grid, data.colNums, data.rowNums, cs, cn)) { found = true; break; }
          }
        }
        if (found) { setShowWin(true); playSound("win"); }
      }, [JSON.stringify(data.scores)]);

      // Tab config
      const TABS = [
        { id: "board", icon: "🏈", label: "Board" },
        { id: "scores", icon: "📊", label: "Scores" },
        { id: "props", icon: "🎯", label: "Props" },
        { id: "chat", icon: "💬", label: "Chat", badge: (data.chat || []).length > 0 },
        { id: "pay", icon: "💰", label: "Pay" },
      ];

      if (!joined) return <SetupScreen onJoin={join} />;

      return (
        <div style={{ minHeight: "100vh", background: "var(--bg)" }}>
          {toastMsg && <Toast msg={toastMsg} onDone={() => setToastMsg(null)} />}
          {showSettings && <SettingsModal data={data} dbr={dbr} onClose={() => setShowSettings(false)} toast={toast} toggleTheme={() => setIsDark(!isDark)} isDark={isDark} />}
          {showOnboarding && <OnboardingModal onClose={() => { setShowOnboarding(false); localStorage.setItem("onboarded", "true"); }} />}
          {showShare && <ShareModal data={data} room={room} onClose={() => setShowShare(false)} toast={toast} />}
          {showRules && <RulesModal data={data} onClose={() => setShowRules(false)} />}
          {showWin && <WinnerModal data={data} onClose={() => setShowWin(false)} />}
          {showNeed && <NeedToWinModal data={data} myName={myName} onClose={() => setShowNeed(false)} />}

          {/* Avatar Picker */}
          {showAvatarPicker && (
            <div style={{ position: "fixed", inset: 0, zIndex: 999, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }} onClick={e => e.target === e.currentTarget && setShowAvatarPicker(false)}>
              <div style={{ background: "var(--card)", borderRadius: 16, padding: 24, maxWidth: 340, width: "100%", border: "1px solid var(--border2)" }}>
                <div className="bebas" style={{ fontSize: 18, letterSpacing: 2, color: "var(--gold)", marginBottom: 12 }}>CHOOSE AVATAR</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(6,1fr)", gap: 8 }}>
                  {AVATARS.map(a => (
                    <button key={a} onClick={() => setMyAvatar(a)} style={{
                      fontSize: 28, padding: 8, borderRadius: 10, border: `2px solid ${avatar === a ? "var(--gold)" : "var(--border)"}`,
                      background: avatar === a ? "var(--gold-glow)" : "var(--card)", cursor: "pointer"
                    }}>{a}</button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <GameHeader data={data} myName={myName} />

          {/* Action Bar */}
          <div style={{ display: "flex", gap: 6, padding: "8px 12px", justifyContent: "center" }}>
            <button onClick={() => setShowAvatarPicker(true)} style={{
              display: "flex", alignItems: "center", gap: 4, padding: "6px 12px", borderRadius: 8,
              border: "1px solid var(--border2)", background: "var(--card)", color: "var(--text)", fontSize: 12, fontWeight: 600
            }}>
              <span style={{ fontSize: 16 }}>{avatar || "😀"}</span> {myName}
            </button>
            {data.colNums && <button onClick={() => setShowNeed(true)} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid var(--border2)", background: "var(--gold-glow)", color: "var(--gold)", fontSize: 12, fontWeight: 600 }}>
              🔢 Need
            </button>}
            <button onClick={() => setShowShare(true)} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid var(--border2)", background: "var(--card)", color: "var(--soft)", fontSize: 12, fontWeight: 600 }}>
              📤 Share
            </button>
            <button onClick={() => setShowSettings(true)} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid var(--border2)", background: "var(--card)", color: "var(--soft)", fontSize: 12, fontWeight: 600 }}>
              ⚙
            </button>
            <button onClick={() => setShowRules(true)} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid var(--border2)", background: "var(--card)", color: "var(--soft)", fontSize: 12, fontWeight: 600 }}>
              📋
            </button>
          </div>

          {/* Tab Content */}
          <div style={{
            paddingBottom: 80,
            flex: 1, display: "flex", flexDirection: "column",
            justifyContent: tab === "board" ? "center" : "flex-start"
          }}>
            {tab === "board" && <BoardTab data={data} myName={myName} dbr={dbr} toast={toast} />}
            {tab === "scores" && <ScoresTab data={data} dbr={dbr} toast={toast} />}
            {tab === "props" && <PropsTab data={data} myName={myName} dbr={dbr} toast={toast} />}
            {tab === "chat" && <ChatTab data={data} myName={myName} dbr={dbr} />}
            {tab === "pay" && <PayTab data={data} myName={myName} dbr={dbr} toast={toast} />}
          </div>

          {/* Bottom Navigation */}
          <div className="bottom-nav">
            {TABS.map(t => (
              <button key={t.id} className={`nav-btn ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>
                <span className="nav-icon">{t.icon}</span>
                <span>{t.label}</span>
                <span className="nav-dot" />
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ── Render ─────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
